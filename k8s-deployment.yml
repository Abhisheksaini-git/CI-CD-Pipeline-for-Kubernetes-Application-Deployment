apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-cicd-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-cicd-app
  template:
    metadata:
      labels:
        app: my-cicd-app
    spec:
      containers:
        - name: my-cicd-app
          image: abhishekkhub/my-cicd-app:1.0
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: my-cicd-app-service
spec:
  type: NodePort
  selector:
    app: my-cicd-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
